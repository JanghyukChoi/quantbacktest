name: A number looks wrong
description: A figure disagrees with another tool, a definition, or common sense.
title: "[wrong number] "
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: Which figure, and what do you believe it should be?
      description: One sentence. Give the formula, the other tool, or the reference you compare with.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: The shortest code that shows it
      description: A seeded random panel is fine. Please do not paste data you may not share.
      render: python
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: What it prints, and what you expected
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
  - type: textarea
    id: sure
    attributes:
      label: How sure are you, and what would change your mind?
